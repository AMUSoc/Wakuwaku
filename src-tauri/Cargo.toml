[package]
name = "wakuwaku"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Pengjie Zhou"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: her windows see-through on macOS (tauri.conf.json
# macOSPrivateApi); nothing elsewhere.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sys-locale = "0.3"
ureq = { version = "3.4.2", features = ["json"] }
# The SHA-256 of an update downloaded (updates.rs); already in the tree, under Tauri.
sha2 = "0.10"
# Tauri's async runtime made with fewer threads (main.rs); already in the tree, under Tauri.
tokio = { version = "1", features = ["rt-multi-thread"] }
# The phone page's token and the ntfy topic (mobile.rs); already in the tree, under Tauri.
getrandom = "0.3"
# The Master Duel helper's picture of the game (duel.rs); already in the tree, under Tauri.
png = "0.17"
# The card database's zip opened (cards.rs); already in the tree, under png.
miniz_oxide = "0.8"
# The official card pictures (YGOPRODeck's are JPEG) a deck's cards are
# told by (art.rs); the crate already in the tree, under Tauri, with its
# JPEG decoder now.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[features]
default = ["custom-protocol"]
# Serve the pages from the binary; without it Tauri waits for a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
# WebView2's ProcessFailed: her pages' renderer gone (crash/win.rs); both
# already in the tree, under Tauri.
webview2-com = "0.39"
windows-core = "0.62"

[target."cfg(target_os = \"macos\")".dependencies]
# The island over the menu bar, round the notch (notch.rs): the window's level
# and the screen's notch; both already in the tree, under Tauri.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target."cfg(unix)".dependencies]
# The local time off Windows (widgets.rs local_now: localtime_r); already in
# the tree, under Tauri.
libc = "0.2"
